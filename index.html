<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Vivien</title>
    <style>
        /* Name-Overlay */
        .name-overlay {
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }
        .greetings {
            font-size: 5rem;
            font-weight: 900;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            text-shadow: 0 0 20px rgba(255, 150, 150, 0.8);
        }
        .greetings > span {
            animation: glow 3s ease-in-out infinite;
            color: #cc0033;
            text-shadow: 0 0 15px #ff6080, 0 0 40px #ffb7c5, 0 0 80px #ffffff;
        }
        @keyframes glow {
            0%, 100% { 
                color: #cc0033;
                text-shadow: 0 0 15px #ff6080, 0 0 40px #ffb7c5, 0 0 80px #ffffff;
            }
            50% { 
                color: #ffffff;
                text-shadow: 0 0 30px #ff3366, 0 0 60px #ff6080, 0 0 100px #ffffff;
            }
        }
        .greetings > span:nth-child(1) { animation-delay: 0s; }
        .greetings > span:nth-child(2) { animation-delay: 0.2s; }
        .greetings > span:nth-child(3) { animation-delay: 0.4s; }
        .greetings > span:nth-child(4) { animation-delay: 0.6s; }
        .greetings > span:nth-child(5) { animation-delay: 0.8s; }
        .greetings > span:nth-child(6) { animation-delay: 1.0s; }
        .greetings > span:nth-child(7) { animation-delay: 1.2s; }
        .greetings > span:nth-child(8) { animation-delay: 1.4s; }

        .description {
            font-size: 1.2rem;
            margin-top: 8px;
            color: #cc0033;
            text-shadow: 0 0 10px #ffb7c5;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
        }
        @media screen and (max-width:574px) {
            .greetings { font-size: 2.8rem; }
            .description { font-size: 0.9rem; }
        }
    </style>
</head>
<body class="container">
  <!-- Blumen-Szene -->
    <div class="night"></div>
    <div class="flowers">
